name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Prepare variables
        run: |
          echo "ID=$(grep '^extId=' gradle.properties | cut -d'=' -f2)" >> $GITHUB_ENV
          version=$(echo ${{ github.event.head_commit.id }} | cut -c1-7)
          echo "VERSION=v$version" >> $GITHUB_ENV

      - name: Build
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/${{ env.ID }}-${{ env.VERSION }}.eapk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ID }}-${{ env.VERSION }}.eapk
          path: dist/${{ env.ID }}-${{ env.VERSION }}.eapk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            Build automatico dell'estensione Khinsider per Echo.
            Scarica il file .eapk, installalo e apri Echo.
          files: dist/${{ env.ID }}-${{ env.VERSION }}.eapk
